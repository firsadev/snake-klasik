<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1215">
<meta name="description" content="Game Snake klasik yang bisa dimainkan tanpa internet.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Snake">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Snake Klasik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap">
<style>
/* Tampilan modern: gelap, kartu kaca, ular halus dengan gradasi, apel bercahaya. */
:root {
  color-scheme: dark;
  --bg: #0b1215;
  --bg-glow: rgba(45, 212, 191, 0.10);
  --fg: #e8f1f0;
  --muted: #8aa0a2;
  --card: rgba(255, 255, 255, 0.045);
  --card-line: rgba(255, 255, 255, 0.09);
  --board: #0f1a1e;
  --dot: rgba(255, 255, 255, 0.055);
  --snake-a: #5eead4;
  --snake-b: #0d9488;
  --eye: #06201d;
  --food: #fb7185;
  --accent: #2dd4bf;
  --accent-fg: #04201c;
  --chip: rgba(255, 255, 255, 0.07);
  --danger: rgba(251, 113, 133, 0.35);
  --brick: #c4673f;
  --brick-dark: #6e301d;
  --brick-light: rgba(255, 255, 255, 0.2);
  --font-display: "Outfit", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #eef3f4;
    --bg-glow: rgba(20, 184, 166, 0.14);
    --fg: #112326;
    --muted: #5b7377;
    --card: rgba(255, 255, 255, 0.7);
    --card-line: rgba(17, 35, 38, 0.1);
    --board: #f9fcfc;
    --dot: rgba(17, 35, 38, 0.08);
    --snake-a: #14b8a6;
    --snake-b: #0f766e;
    --eye: #ffffff;
    --food: #e11d48;
    --accent: #0f766e;
    --accent-fg: #f2fffd;
    --chip: rgba(17, 35, 38, 0.06);
    --danger: rgba(225, 29, 72, 0.22);
    --brick: #c2552b;
    --brick-dark: #8a3a1e;
    --brick-light: rgba(255, 255, 255, 0.28);
  }
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(60% 40% at 50% 0%, var(--bg-glow), transparent 70%),
    var(--bg);
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  -webkit-tap-highlight-color: transparent;
  padding-block: max(20px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo {
  width: 34px; height: 34px; border-radius: 10px; flex: none;
  background: linear-gradient(135deg, var(--snake-a), var(--snake-b));
  display: grid; place-items: center;
}
.logo svg { width: 20px; height: 20px; }
h1 { font-family: var(--font-display); font-size: 1.375rem; font-weight: 700; letter-spacing: -0.01em; margin: 0; line-height: 1.1; }
.chips { display: flex; gap: 8px; }
.chip {
  background: var(--chip); border: 1px solid var(--card-line); border-radius: 12px;
  padding: 6px 12px; min-width: 64px; display: flex; flex-direction: column; align-items: flex-start;
}
.chip span { font-size: 0.625rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.chip strong { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; display: inline-block; }
.chip strong.pop { animation: pop 0.28s ease-out; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.28); color: var(--accent); } 100% { transform: scale(1); } }

.board-card {
  background: var(--card); border: 1px solid var(--card-line); border-radius: 22px; padding: 10px;
  box-shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.55);
}
.board-wrap { position: relative; border-radius: 14px; overflow: hidden; background: var(--board); }
canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; touch-action: none; }
.overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; text-align: center; padding: 20px;
  background: color-mix(in srgb, var(--bg) 62%, transparent);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.overlay[hidden] { display: none !important; }
.overlay h2 { font-family: var(--font-display); font-size: 1.75rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.overlay p { margin: 0 0 8px; color: var(--muted); font-size: 0.9375rem; max-width: 28ch; }

button {
  font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 12px;
  background: var(--accent); color: var(--accent-fg); padding: 11px 26px;
  transition: transform 0.12s ease, filter 0.12s ease;
}
button:hover { filter: brightness(1.08); }
button:active { transform: scale(0.96); }
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.ghost { background: var(--chip); color: var(--fg); border: 1px solid var(--card-line); padding: 9px 18px; }
.speed { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.speed-label { font-size: 0.625rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--chip); border: 1px solid var(--card-line); border-radius: 14px; flex: 1 1 280px; max-width: 340px; }
.seg button { flex: 1; padding: 8px 4px; font-size: 0.8125rem; border-radius: 10px; background: transparent; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.btns { display: flex; gap: 8px; }
.hint { color: var(--muted); font-size: 0.8125rem; margin: 0; line-height: 1.45; max-width: 36ch; }
@media (prefers-reduced-motion: reduce) {
  .chip strong.pop { animation: none; }
  button { transition: none; }
}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#04201c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h9a4 4 0 0 0 0-8H9a3 3 0 0 1 0-6h10"/></svg>
      </div>
      <h1>Snake Klasik</h1>
    </div>
    <div class="chips">
      <div class="chip"><span>Skor</span><strong id="score">0</strong></div>
      <div class="chip"><span>Level</span><strong id="level">1</strong></div>
      <div class="chip"><span>Terbaik</span><strong id="best">0</strong></div>
    </div>
  </header>

  <div class="board-card">
    <div class="board-wrap">
      <canvas id="board" width="400" height="400" aria-label="Papan permainan Snake"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ov-title">Siap main?</h2>
        <p id="ov-text">Dinding bisa ditembus. Makan apel, hindari batu bata dan tubuhmu sendiri.</p>
        <button id="ov-btn" type="button">Mulai</button>
      </div>
    </div>
  </div>

  <div class="speed">
    <span class="speed-label" id="speed-label">Kecepatan</span>
    <div class="seg" role="group" aria-labelledby="speed-label">
      <button type="button" data-speed="pelan" aria-pressed="false">Pelan</button>
      <button type="button" data-speed="normal" aria-pressed="true">Normal</button>
      <button type="button" data-speed="cepat" aria-pressed="false">Cepat</button>
      <button type="button" data-speed="ngebut" aria-pressed="false">Ngebut</button>
    </div>
  </div>

  <div class="bar">
    <p class="hint">Ketuk di atas, bawah, kiri, atau kanan kepala ular untuk belok. Tiap level ada batu bata baru. Di laptop: panah atau WASD.</p>
    <div class="btns">
      <button class="ghost" id="sound" type="button" aria-pressed="true">Suara nyala</button>
      <button class="ghost" id="pause" type="button">Jeda</button>
    </div>
  </div>
</main>

<script>
(function () {
  var N = 20, CELL = 20, SIZE = N * CELL;
  var canvas = document.getElementById("board");
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = SIZE * dpr; canvas.height = SIZE * dpr;
  ctx.scale(dpr, dpr);

  var el = {
    score: document.getElementById("score"), best: document.getElementById("best"), level: document.getElementById("level"),
    overlay: document.getElementById("overlay"), ovTitle: document.getElementById("ov-title"),
    ovText: document.getElementById("ov-text"), ovBtn: document.getElementById("ov-btn"),
    pause: document.getElementById("pause")
  };

  var snake, prev, dir, queue, food, score, best = 0, state = "idle", timer = null, delay;
  var lastTick = 0, elapsedHold = 0, deathAt = 0, particles = [];
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var colors = {};
  var bricks = [], brickSet = {}, banner = null;

  var SPEEDS = {
    pelan: { start: 190, min: 110 },
    normal: { start: 140, min: 70 },
    cepat: { start: 100, min: 55 },
    ngebut: { start: 75, min: 42 }
  };
  var speedKey = "normal";
  try {
    best = parseInt(localStorage.getItem("snake-klasik-best"), 10) || 0;
    var savedSpeed = localStorage.getItem("snake-klasik-speed");
    if (savedSpeed && SPEEDS[savedSpeed]) speedKey = savedSpeed;
  } catch (e) {}
  el.best.textContent = best;

  function calcDelay() {
    var s = SPEEDS[speedKey];
    return Math.max(s.min, s.start - 4 * score);
  }

  var speedBtns = document.querySelectorAll(".seg button");
  function syncSpeedButtons() {
    speedBtns.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.speed === speedKey)); });
  }
  speedBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      speedKey = b.dataset.speed;
      try { localStorage.setItem("snake-klasik-speed", speedKey); } catch (e) {}
      syncSpeedButtons();
      delay = calcDelay();
      b.blur();
    });
  });
  syncSpeedButtons();

  /* Efek suara: nada sinus lembut dengan envelope halus, disaring low-pass. */
  var audio = { ctx: null, master: null };
  var muted = false;
  try { muted = localStorage.getItem("snake-klasik-muted") === "1"; } catch (e) {}
  var soundBtn = document.getElementById("sound");

  function ensureAudio() {
    if (!audio.ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      audio.ctx = new AC();
      audio.master = audio.ctx.createGain();
      audio.master.gain.value = 0.55;
      var lp = audio.ctx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 2600;
      audio.master.connect(lp); lp.connect(audio.ctx.destination);
    }
    if (audio.ctx.state === "suspended") audio.ctx.resume();
    return true;
  }

  function tone(freq, at, dur, vol, type, freqEnd) {
    var c = audio.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, at);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, at + dur);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(audio.master);
    o.start(at); o.stop(at + dur + 0.05);
  }

  function sfx(name) {
    if (muted || !ensureAudio()) return;
    var t = audio.ctx.currentTime + 0.01;
    if (name === "eat") {
      tone(523, t, 0.14, 0.22, "sine", 784);
      tone(1047, t + 0.06, 0.16, 0.08, "sine");
    } else if (name === "levelup") {
      [523, 659, 784, 1047].forEach(function (f, i) { tone(f, t + i * 0.075, 0.22, 0.2, "sine"); });
    } else if (name === "start" || name === "resume") {
      tone(392, t, 0.2, 0.16, "sine", 587);
    } else if (name === "pause") {
      tone(587, t, 0.16, 0.14, "sine", 392);
    } else if (name === "over") {
      tone(330, t, 0.55, 0.2, "triangle", 110);
      tone(247, t + 0.1, 0.5, 0.1, "sine", 82);
    } else if (name === "record") {
      [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, t + i * 0.09, 0.3, 0.18, "sine"); });
    }
  }

  function syncSound() {
    soundBtn.textContent = muted ? "Suara mati" : "Suara nyala";
    soundBtn.setAttribute("aria-pressed", String(!muted));
  }
  soundBtn.addEventListener("click", function () {
    muted = !muted;
    try { localStorage.setItem("snake-klasik-muted", muted ? "1" : "0"); } catch (e) {}
    syncSound();
    if (!muted) sfx("resume");
    soundBtn.blur();
  });
  syncSound();

  function loadColors() {
    var cs = getComputedStyle(document.documentElement);
    ["--board", "--dot", "--snake-a", "--snake-b", "--eye", "--food", "--danger", "--accent", "--fg", "--brick", "--brick-dark", "--brick-light"].forEach(function (k) {
      colors[k] = cs.getPropertyValue(k).trim();
    });
  }

  function popEl(node) {
    node.classList.remove("pop"); void node.offsetWidth; node.classList.add("pop");
  }

  function placeFood() {
    var free = [];
    for (var x = 0; x < N; x++) for (var y = 0; y < N; y++) {
      if (!isSnakeCell(x, y) && !hasBrick(x, y)) free.push({ x: x, y: y });
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  /* BRICKS-START
     Dinding bisa ditembus (dunia melingkar). Tiap level punya rintangan batu bata acak:
     makin tinggi level, makin banyak keping, makin panjang, dan mulai level 8 ada yang berbentuk L.
     Batu bata tidak muncul di tubuh ular, di dekat kepala, atau di jalur lurus 6 petak di depannya,
     dan susunannya selalu menyisakan ruang yang tersambung. */
  function wrapN(v) { return ((v % N) + N) % N; }
  function isSnakeCell(x, y) { return snake.some(function (s) { return s.x === x && s.y === y; }); }
  function hasBrick(x, y) { return !!brickSet[y * N + x]; }

  function brickPlan(level) {
    return {
      pieces: Math.min(2 + Math.floor(level * 1.5), 22),
      maxLen: Math.min(1 + Math.floor((level - 1) / 3), 4),
      maxCells: 70
    };
  }

  function buildBricks(level, pieces) {
    var plan = brickPlan(level), set = {}, list = [], placed = 0, attempt = 0;
    var head = snake[0];
    function safe(x, y) {
      if (isSnakeCell(x, y)) return false;
      if (food && food.x === x && food.y === y) return false;
      var ddx = Math.abs(x - head.x), ddy = Math.abs(y - head.y);
      ddx = Math.min(ddx, N - ddx); ddy = Math.min(ddy, N - ddy);
      if (ddx + ddy <= 3) return false;
      for (var s = 1; s <= 6; s++) {
        if (wrapN(head.x + dir.x * s) === x && wrapN(head.y + dir.y * s) === y) return false;
      }
      return true;
    }
    while (placed < pieces && attempt < pieces * 25 && list.length < plan.maxCells) {
      attempt++;
      var len = 1 + Math.floor(Math.random() * plan.maxLen);
      var horiz = Math.random() < 0.5;
      var sx = Math.floor(Math.random() * N), sy = Math.floor(Math.random() * N);
      var shape = [];
      for (var i = 0; i < len; i++) shape.push({ x: wrapN(sx + (horiz ? i : 0)), y: wrapN(sy + (horiz ? 0 : i)) });
      if (level >= 8 && len >= 2 && Math.random() < 0.35) {
        shape.push({ x: wrapN(sx + (horiz ? 0 : 1)), y: wrapN(sy + (horiz ? 1 : 0)) });
      }
      var ok = shape.every(function (c) { return safe(c.x, c.y) && !set[c.y * N + c.x]; });
      if (!ok) continue;
      shape.forEach(function (c) { set[c.y * N + c.x] = true; list.push({ x: c.x, y: c.y }); });
      placed++;
    }
    return { set: set, list: list };
  }

  function bricksConnected(set, count) {
    var head = snake[0], start = head.y * N + head.x, seen = {}, stack = [start], reached = 0;
    seen[start] = true;
    var steps = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    while (stack.length) {
      var c = stack.pop(); reached++;
      var cx = c % N, cy = (c - cx) / N;
      for (var d = 0; d < 4; d++) {
        var k = wrapN(cy + steps[d][1]) * N + wrapN(cx + steps[d][0]);
        if (!seen[k] && !set[k]) { seen[k] = true; stack.push(k); }
      }
    }
    return reached === N * N - count;
  }

  function generateBricks(level) {
    var plan = brickPlan(level), result = null;
    for (var tries = 0; tries < 40; tries++) {
      var pieces = tries < 20 ? plan.pieces : Math.max(1, Math.floor(plan.pieces / 2));
      var r = buildBricks(level, pieces);
      if (bricksConnected(r.set, r.list.length)) { result = r; break; }
    }
    var now = performance.now();
    bricks = result ? result.list : []; brickSet = result ? result.set : {};
    bricks.forEach(function (b) { b.born = now; });
  }
  /* BRICKS-END */

  function reset() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    prev = snake.map(function (s) { return { x: s.x, y: s.y }; });
    dir = { x: 1, y: 0 }; queue = []; score = 0; delay = calcDelay(); particles = []; deathAt = 0; elapsedHold = 0;
    banner = null; food = null;
    el.score.textContent = 0; el.level.textContent = 1;
    generateBricks(1);
    placeFood();
  }

  function showOverlay(title, text, btn) {
    el.ovTitle.textContent = title; el.ovText.textContent = text; el.ovBtn.textContent = btn;
    el.overlay.hidden = false;
  }

  function start() {
    var now = performance.now();
    if (state === "over") reset();
    var resuming = state === "paused";
    sfx(resuming ? "resume" : "start");
    state = "running"; el.overlay.hidden = true; el.pause.textContent = "Jeda";
    if (!resuming) elapsedHold = 0;
    lastTick = now - elapsedHold;
    clearTimeout(timer);
    timer = setTimeout(tick, Math.max(0, delay - elapsedHold));
  }

  function pause() {
    if (state !== "running") return;
    elapsedHold = performance.now() - lastTick;
    state = "paused"; clearTimeout(timer); sfx("pause");
    showOverlay("Dijeda", "Tekan spasi atau tombol untuk lanjut.", "Lanjut");
    el.pause.textContent = "Lanjut";
  }

  function toggle() {
    if (state === "running") pause(); else start();
  }

  function gameOver() {
    state = "over"; clearTimeout(timer); deathAt = performance.now();
    sfx(score > best ? "record" : "over");
    if (score > best) {
      best = score; el.best.textContent = best; popEl(el.best);
      try { localStorage.setItem("snake-klasik-best", String(best)); } catch (e) {}
    }
    setTimeout(function () {
      if (state === "over") showOverlay("Game selesai", "Skor kamu " + score + (score && score === best ? ", rekor baru!" : "."), "Main lagi");
    }, 350);
  }

  function burst(cx, cy) {
    if (reduceMotion) return;
    for (var i = 0; i < 12; i++) {
      var ang = (Math.PI * 2 * i) / 12 + Math.random() * 0.4, sp = 40 + Math.random() * 60;
      particles.push({ x: cx, y: cy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, born: performance.now() });
    }
  }

  function tick() {
    if (queue.length) dir = queue.shift();
    var head = { x: wrapN(snake[0].x + dir.x), y: wrapN(snake[0].y + dir.y) };
    var eating = food && head.x === food.x && head.y === food.y;
    var body = eating ? snake : snake.slice(0, -1);
    var hit = hasBrick(head.x, head.y) ||
      body.some(function (s) { return s.x === head.x && s.y === head.y; });
    if (hit) { prev = snake.map(function (s) { return { x: s.x, y: s.y }; }); gameOver(); return; }
    prev = snake.map(function (s) { return { x: s.x, y: s.y }; });
    snake.unshift(head);
    if (eating) {
      burst(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2);
      prev.push({ x: prev[prev.length - 1].x, y: prev[prev.length - 1].y });
      score++; el.score.textContent = score; popEl(el.score);
      var lvl = Math.floor(score / 5) + 1;
      var leveled = String(lvl) !== el.level.textContent;
      if (leveled) {
        el.level.textContent = lvl; popEl(el.level);
        generateBricks(lvl);
        banner = { text: "Level " + lvl, at: performance.now() };
      }
      sfx(leveled ? "levelup" : "eat");
      delay = calcDelay();
      placeFood();
    } else {
      snake.pop();
    }
    if (!food) { gameOver(); return; }
    lastTick = performance.now(); elapsedHold = 0;
    timer = setTimeout(tick, delay);
  }

  function turn(dx, dy) {
    var last = queue.length ? queue[queue.length - 1] : dir;
    if ((dx === -last.x && dy === -last.y) || (dx === last.x && dy === last.y)) return;
    if (queue.length < 2) queue.push({ x: dx, y: dy });
    if (state === "idle" || state === "over" || state === "paused") start();
  }

  var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  function mix(c1, c2, t) {
    function p(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
    var a = p(c1), b = p(c2);
    return "rgb(" + a.map(function (v, i) { return Math.round(v + (b[i] - v) * t); }).join(",") + ")";
  }

  function wrapDelta(d) { return d - N * Math.round(d / N); }

  function drawSnake(pts, ox, oy) {
    var n = pts.length;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (var i = n - 1; i > 0; i--) {
      var k = n > 1 ? i / (n - 1) : 0;
      ctx.strokeStyle = mix(colors["--snake-a"], colors["--snake-b"], k);
      ctx.lineWidth = CELL * (0.78 - 0.18 * k);
      ctx.beginPath(); ctx.moveTo(pts[i].x + ox, pts[i].y + oy); ctx.lineTo(pts[i - 1].x + ox, pts[i - 1].y + oy); ctx.stroke();
    }
    var hx = pts[0].x + ox, hy = pts[0].y + oy;
    ctx.fillStyle = colors["--snake-a"];
    ctx.beginPath(); ctx.arc(hx, hy, CELL * 0.43, 0, Math.PI * 2); ctx.fill();
    var ex = dir.x, ey = dir.y, px = -ey, py = ex;
    ctx.fillStyle = colors["--eye"];
    [-1, 1].forEach(function (side) {
      ctx.beginPath();
      ctx.arc(hx + ex * 3.5 + px * side * 3.6, hy + ey * 3.5 + py * side * 3.6, 1.9, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawBrick(b, now) {
    var a = reduceMotion ? 1 : Math.min(1, (now - b.born) / 500);
    var sc = 0.6 + 0.4 * a;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(b.x * CELL + CELL / 2, b.y * CELL + CELL / 2);
    ctx.scale(sc, sc);
    ctx.translate(-CELL / 2, -CELL / 2);
    ctx.fillStyle = colors["--brick-dark"];
    ctx.fillRect(0, 0, CELL, CELL);
    var rows = [[[1, 9.5], [10.5, 19]], [[1, 4.5], [5.5, 14.5], [15.5, 19]]];
    rows.forEach(function (row, r) {
      var y0 = r === 0 ? 1 : 10.5, h = 8.5;
      row.forEach(function (seg) {
        ctx.fillStyle = colors["--brick"];
        ctx.fillRect(seg[0], y0, seg[1] - seg[0], h);
        ctx.fillStyle = colors["--brick-light"];
        ctx.fillRect(seg[0], y0, seg[1] - seg[0], 1.2);
      });
    });
    ctx.restore();
  }

  function render(now) {
    var t = 1;
    if (state === "running") t = Math.min(1, (now - lastTick) / delay);
    else if (state === "paused") t = Math.min(1, elapsedHold / delay);
    if (reduceMotion) t = 1;

    ctx.clearRect(0, 0, SIZE, SIZE);
    ctx.fillStyle = colors["--board"]; ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.fillStyle = colors["--dot"];
    for (var gx = 0; gx < N; gx++) for (var gy = 0; gy < N; gy++) {
      ctx.beginPath(); ctx.arc(gx * CELL + CELL / 2, gy * CELL + CELL / 2, 1.1, 0, Math.PI * 2); ctx.fill();
    }

    bricks.forEach(function (b) { drawBrick(b, now); });

    if (food) {
      var pulse = 1 + (reduceMotion ? 0 : Math.sin(now / 280) * 0.08);
      var fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
      ctx.save();
      ctx.shadowColor = colors["--food"]; ctx.shadowBlur = 14;
      ctx.fillStyle = colors["--food"];
      ctx.beginPath(); ctx.arc(fx, fy, CELL * 0.32 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.beginPath(); ctx.arc(fx - 2, fy - 2.5, 1.8, 0, Math.PI * 2); ctx.fill();
    }

    /* Posisi tiap ruas, disambung secara melingkar supaya ular yang menembus dinding
       tidak digambar sebagai garis panjang melintasi papan. */
    var raw = snake.map(function (s, i) {
      var p = prev[i] || s;
      return { x: p.x + wrapDelta(s.x - p.x) * t, y: p.y + wrapDelta(s.y - p.y) * t };
    });
    var pts = [{ x: raw[0].x * CELL + CELL / 2, y: raw[0].y * CELL + CELL / 2 }];
    for (var q = 1; q < raw.length; q++) {
      pts.push({
        x: pts[q - 1].x + wrapDelta(raw[q].x - raw[q - 1].x) * CELL,
        y: pts[q - 1].y + wrapDelta(raw[q].y - raw[q - 1].y) * CELL
      });
    }
    var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    pts.forEach(function (p) {
      minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
      minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
    });
    for (var oy = -1; oy <= 1; oy++) for (var ox = -1; ox <= 1; ox++) {
      if (maxX + ox * SIZE > -CELL && minX + ox * SIZE < SIZE + CELL &&
          maxY + oy * SIZE > -CELL && minY + oy * SIZE < SIZE + CELL) drawSnake(pts, ox * SIZE, oy * SIZE);
    }

    for (var j = particles.length - 1; j >= 0; j--) {
      var pa = particles[j], age = (now - pa.born) / 450;
      if (age >= 1) { particles.splice(j, 1); continue; }
      ctx.globalAlpha = 1 - age;
      ctx.fillStyle = colors["--food"];
      ctx.beginPath(); ctx.arc(pa.x + pa.vx * age, pa.y + pa.vy * age, 2.6 * (1 - age) + 0.6, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    if (banner) {
      var ba = (now - banner.at) / 1700;
      if (ba >= 1) banner = null;
      else {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ba < 0.12 ? ba / 0.12 : 1 - (ba - 0.12) / 0.88);
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 14;
        ctx.fillStyle = colors["--accent"];
        ctx.font = "700 36px Outfit, system-ui, sans-serif";
        ctx.fillText(banner.text, SIZE / 2, SIZE / 2 - 10);
        ctx.fillStyle = colors["--fg"];
        ctx.font = "500 14px Inter, system-ui, sans-serif";
        ctx.fillText("Batu bata baru muncul", SIZE / 2, SIZE / 2 + 20);
        ctx.restore();
      }
    }

    if (state === "over" && deathAt) {
      var da = Math.max(0, 1 - (now - deathAt) / 600);
      if (da > 0) {
        ctx.fillStyle = colors["--danger"]; ctx.globalAlpha = da; ctx.fillRect(0, 0, SIZE, SIZE); ctx.globalAlpha = 1;
      }
    }
    requestAnimationFrame(render);
  }

  document.addEventListener("keydown", function (e) {
    var map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
    if (map[e.key]) { e.preventDefault(); turn.apply(null, DIRS[map[e.key]]); }
    else if (e.key === " ") {
      if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
      e.preventDefault(); toggle();
    }
  });

  el.ovBtn.addEventListener("click", start);
  el.pause.addEventListener("click", toggle);

  /* Ketuk papan: ular belok ke arah area yang diketuk, dihitung dari posisi kepalanya.
     Ular tidak bisa berbalik arah, jadi belokannya selalu tegak lurus dengan arah jalannya. */
  function tapTurn(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    var k = SIZE / rect.width;
    var dx = (clientX - rect.left) * k - (snake[0].x * CELL + CELL / 2);
    var dy = (clientY - rect.top) * k - (snake[0].y * CELL + CELL / 2);
    var last = queue.length ? queue[queue.length - 1] : dir;
    var dead = CELL * 0.5;
    function open(sx, sy) {
      var nx = wrapN(snake[0].x + sx), ny = wrapN(snake[0].y + sy);
      return !hasBrick(nx, ny) && !isSnakeCell(nx, ny);
    }
    if (last.x !== 0) {
      if (Math.abs(dy) >= dead) turn(0, dy > 0 ? 1 : -1);
      else if (dx * last.x < 0) turn(0, open(0, 1) ? 1 : -1);
    } else {
      if (Math.abs(dx) >= dead) turn(dx > 0 ? 1 : -1, 0);
      else if (dy * last.y < 0) turn(open(1, 0) ? 1 : -1, 0);
    }
  }

  var downX = 0, downY = 0, downId = null;
  canvas.addEventListener("pointerdown", function (e) {
    downX = e.clientX; downY = e.clientY; downId = e.pointerId;
  });
  canvas.addEventListener("pointerup", function (e) {
    if (e.pointerId !== downId) return;
    downId = null;
    var dx = e.clientX - downX, dy = e.clientY - downY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) { tapTurn(e.clientX, e.clientY); return; }
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
  });
  canvas.addEventListener("pointercancel", function () { downId = null; });

  document.addEventListener("visibilitychange", function () { if (document.hidden) pause(); });
  window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", loadColors);

  loadColors();
  reset();
  requestAnimationFrame(render);
})();
</script>
<script>
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
